<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>MAI — Примерка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1920px;
            height: 1024px;
            overflow-x: hidden;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #ff2a6d 0%, #c94b8b 100%);
            color: #222;
        }

        .page__texture {
            position: fixed;
            top: 0; left: 0;
            width: 1920px; height: 1024px;
            z-index: 0;
            pointer-events: none;
            display: block;
            opacity: 0.7;
        }

        /* ============ ШАПКА ============ */
        .header {
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
            width: 1920px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 0 60px;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(135deg, #FF427E 0%, #FF3C79 21%, #FF7CA5 47%, #D0577D 71%, #772640 100%);
            background-size: 1920px 1024px;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .header__water {
            position: absolute;
            top: 0; left: 0;
            width: 1920px; height: 96px;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .header::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0;
            width: 100%; height: 4px;
            background: #000;
            z-index: 2;
        }

        .header__left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .header__exit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 43.17px; height: 49.33px;
            flex-shrink: 0;
            pointer-events: none;
        }

        .header__exit svg {
            display: block;
            width: 43.17px; height: 49.33px;
        }

        .header__logo {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 24px;
            font-weight: 500;
            color: #FF2A6D;
            background: #0B091A;
            letter-spacing: 2px;
            line-height: 24px;
            padding: 12px 18px;
            border-radius: 6px;
            display: inline-block;
            text-decoration: none;
            pointer-events: auto;
            transition: opacity 0.2s;
        }

        .header__logo:hover { opacity: 0.85; }

        .header__capsule {
            width: 660px; height: 75px;
            background: #0B091A;
            border-radius: 69px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .header__right {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .header__btn {
            padding: 0;
            border: none;
            background: transparent;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            pointer-events: auto;
            text-decoration: none;
        }

        .header__btn:hover { opacity: 0.7; }

        .header__btn svg {
            display: block;
            pointer-events: none;
        }

        /* ============ ОСНОВНОЙ КОНТЕНТ ============ */
        .main-content {
            position: relative;
            z-index: 2;
            padding-top: 106px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 1024px;
        }

        .fitting-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: calc(1024px - 126px);
        }

        /* === ЛЕВАЯ ЧАСТЬ === */
        .fitting-preview {
            background: #fff;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .fitting-preview__placeholder {
            color: #ccc;
            font-size: 14px;
            text-align: center;
        }

        .fitting-preview__result {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 20px;
        }

        .fitting-preview__buttons {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 280px;
            z-index: 5;
        }

        .fitting-btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .fitting-btn--saved {
            background: #1a1a2e;
            color: #fff;
        }

        .fitting-btn--saved:hover {
            background: #2a2a3e;
            transform: translateY(-2px);
        }

        .fitting-btn--primary {
            background: #1a1a2e;
            color: #fff;
            font-size: 17px;
            padding: 18px 32px;
        }

        .fitting-btn--primary:hover {
            background: #ff2a6d;
            transform: translateY(-2px);
        }

        .fitting-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* === ПРАВАЯ ЧАСТЬ === */
        .fitting-panel {
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .fitting-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .fitting-scroll::-webkit-scrollbar { width: 4px; }
        .fitting-scroll::-webkit-scrollbar-track { background: transparent; }
        .fitting-scroll::-webkit-scrollbar-thumb { background: #ff2a6d; border-radius: 2px; }

        .fitting-category-title {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 20px 0 12px 0;
            padding: 10px 14px;
            background: linear-gradient(90deg, rgba(255, 42, 109, 0.3) 0%, transparent 100%);
            border-left: 3px solid #ff2a6d;
            border-radius: 0 6px 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fitting-category-title::before {
            content: '';
            width: 8px; height: 8px;
            background: #ff2a6d;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 42, 109, 0.8);
        }

        .fitting-category-title:first-child { margin-top: 0; }

        .fitting-photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .fitting-photo-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            aspect-ratio: 3/4;
        }

        .fitting-photo-card:hover { border-color: rgba(255, 42, 109, 0.5); }
        .fitting-photo-card.is-selected {
            border-color: #ff2a6d;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }

        .fitting-photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .fitting-photo__badge {
            position: absolute;
            bottom: 6px; left: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .fitting-clothes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .fitting-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            transition: all 0.25s ease;
            aspect-ratio: 3/4;
        }

        .fitting-card:hover { border-color: rgba(255, 42, 109, 0.5); }
        .fitting-card.is-selected {
            border-color: #ff2a6d;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }

        .fitting-card img {
            width: 100%; height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .fitting-card__radio-label {
            position: absolute;
            top: 8px; left: 8px;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px 5px 7px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .fitting-card__radio-label:hover { background: rgba(255, 42, 109, 0.9); }

        .fitting-radio {
            position: absolute;
            opacity: 0; width: 0; height: 0;
            pointer-events: none;
        }

        .fitting-card__radio-visual {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .fitting-card__radio-visual::after {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.2s ease;
        }

        .fitting-radio:checked + .fitting-card__radio-visual {
            border-color: #ff2a6d;
            box-shadow: 0 0 6px rgba(255, 42, 109, 0.8);
        }

        .fitting-radio:checked + .fitting-card__radio-visual::after {
            background: #ff2a6d;
        }

        .fitting-card__radio-text {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .fitting-card__trash {
            position: absolute;
            top: 8px; right: 8px;
            z-index: 2;
            width: 28px; height: 28px;
            border: none;
            background: rgba(0, 0, 0, 0.8);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .fitting-card__trash:hover {
            background: #ff2a6d;
            color: #fff;
            transform: scale(1.1);
        }

        .fitting-card__trash svg {
            width: 14px; height: 14px;
        }

        .fitting-empty-message {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            padding: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .fitting-empty-message a {
            color: #ff2a6d;
            text-decoration: underline;
        }

        .fitting-status {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 30px;
            gap: 16px;
        }

        .fitting-status.is-visible { display: flex; }

        .fitting-loader__text {
            font-size: 18px;
            color: #1a1a2e;
            font-weight: 500;
        }

        .fitting-loader__sub {
            font-size: 13px;
            color: #666;
            text-align: center;
            max-width: 400px;
        }

        .fitting-loader__spinner {
            width: 48px; height: 48px;
            border: 4px solid #eee;
            border-top-color: #ff2a6d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

        <defs>
            <filter id="page-water-ripple" x="-10%" y="-10%" width="120%" height="120%">

            <defs>
                <filter id="header-water-ripple" x="-10%" y="-10%" width="120%" height="120%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="21" result="noise">

        </svg>

        <div class="header__left">
            <a href="../Login/index.html" class="header__exit" aria-label="Выход из аккаунта">

        <div class="header__capsule"></div>

    <div class="main-content">
        <div class="fitting-container">
            <div class="fitting-preview" id="fitting-preview">
                <div class="fitting-preview__placeholder" id="preview-placeholder">
                    Выберите фото и одежду,<br>затем нажмите «Примерить»
                </div>

                <div class="fitting-status" id="fitting-status">
                    <div class="fitting-loader__spinner"></div>
                    <div class="fitting-loader__text" id="status-text">Идёт генерация...</div>
                    <div class="fitting-loader__sub" id="status-sub">Это может занять до 5 минут. Не закрывайте страницу.</div>
                </div>

                <div class="fitting-preview__buttons">
                    <a href="../Saved/index.html" class="fitting-btn fitting-btn--saved">К сохранённым</a>
                    <button class="fitting-btn fitting-btn--primary" id="fitting-btn" type="button">Примерить</button>
                </div>
            </div>

            <div class="fitting-panel">
                <div class="fitting-scroll" id="fitting-scroll">
                    <div class="fitting-grid" id="fitting-grid">
                        <p class="fitting-empty-message">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // =========================================
            // Адрес Flask-сервера берётся из config.js
            // (определяется автоматически, IP не прописан)
            // =========================================
            const API_BASE = SERVER_ORIGIN;

            const grid = document.getElementById('fitting-grid');
            const btn = document.getElementById('fitting-btn');
            const status = document.getElementById('fitting-status');
            const statusText = document.getElementById('status-text');
            const statusSub = document.getElementById('status-sub');
            const placeholder = document.getElementById('preview-placeholder');
            const previewContainer = document.getElementById('fitting-preview');

            const userId = localStorage.getItem('user_id');
            let wishlistItems = [];
            let userPhotos = [];
            let state = 'idle';

            const typeNames = {
                'футболка': 'Футболки', 'куртка': 'Куртки', 'худи': 'Худи',
                'свитер': 'Свитера', 'платье': 'Платья', 'костюм': 'Костюмы',
                'штаны': 'Штаны', 'головной убор': 'Головные уборы',
                'обувь': 'Обувь', 'аксессуар': 'Аксессуары'
            };

            // =========================================
            // 1. ЗАГРУЗКА ДАННЫХ
            // =========================================
            async function loadData() {
                if (!userId || userId === '0') {
                    grid.innerHTML = '<p class="fitting-empty-message">Пожалуйста, <a href="../Login/index.html" style="color: #ff2a6d;">войдите в аккаунт</a>.</p>';
                    return;
                }

                try {
                    const [wishlistRes, photosRes] = await Promise.all([
                        fetch(`${API_BASE}/api/wishlist?user_id=${userId}`),
                        fetch(`${API_BASE}/api/user/photos?user_id=${userId}`)
                    ]);

                    if (!wishlistRes.ok || !photosRes.ok) throw new Error('Ошибка сети');

                    wishlistItems = await wishlistRes.json();
                    userPhotos = await photosRes.json();

                    renderGrid();
                } catch (err) {
                    console.error('Ошибка загрузки:', err);
                    grid.innerHTML = '<p class="fitting-empty-message">Не удалось загрузить данные. Проверьте, запущен ли сервер.</p>';
                }
            }

            // =========================================
            // 2. ОТРИСОВКА
            // =========================================
            function renderGrid() {
                grid.innerHTML = '';

                // --- ФОТО ПОЛЬЗОВАТЕЛЯ ---
                if (userPhotos.length === 0) {
                    const section = document.createElement('div');
                    section.innerHTML = `
                        <h3 class="fitting-category-title">Фото</h3>
                        <p class="fitting-empty-message">Нет фото. <a href="../Upload/index.html" style="color:#ff2a6d;">Загрузить</a></p>
                    `;
                    grid.appendChild(section);
                } else {
                    const section = document.createElement('div');
                    section.innerHTML = '<h3 class="fitting-category-title">Фото</h3>';

                    const photoGrid = document.createElement('div');
                    photoGrid.className = 'fitting-photo-grid';

                    userPhotos.forEach((photoPath, index) => {
                        const card = document.createElement('div');
                        card.className = 'fitting-photo-card';
                        card.dataset.photo = photoPath;
                        card.innerHTML = `
                            <img src="${resolveAsset(photoPath)}" alt="Фото ${index + 1}">
                            <div class="fitting-photo__badge">Фото ${index + 1}</div>
                        `;
                        photoGrid.appendChild(card);
                    });

                    section.appendChild(photoGrid);
                    grid.appendChild(section);
                }

                // --- ОДЕЖДА ---
                if (wishlistItems.length === 0) {
                    const section = document.createElement('div');
                    section.innerHTML = `
                        <h3 class="fitting-category-title">Одежда</h3>
                        <p class="fitting-empty-message">Вишлист пуст. <a href="../Catalog/index.html" style="color:#ff2a6d;">В каталог</a></p>
                    `;
                    grid.appendChild(section);
                } else {
                    const grouped = {};
                    wishlistItems.forEach(item => {
                        const type = item.type || 'Другое';
                        if (!grouped[type]) grouped[type] = [];
                        grouped[type].push(item);
                    });

                    for (const [type, products] of Object.entries(grouped)) {
                        const section = document.createElement('div');
                        section.innerHTML = `<h3 class="fitting-category-title">${typeNames[type] || type}</h3>`;

                        const clothesGrid = document.createElement('div');
                        clothesGrid.className = 'fitting-clothes-grid';

                        const radioGroupName = `fitting_${type.toLowerCase().replace(/\s+/g, '_')}`;

                        products.forEach(item => {
                            const card = document.createElement('div');
                            card.className = 'fitting-card';
                            card.dataset.id = item.id;
                            const radioId = `radio-${item.id}`;

                            card.innerHTML = `
                                <label class="fitting-card__radio-label" for="${radioId}">
                                    <input type="radio" id="${radioId}" name="${radioGroupName}" value="${item.id}" class="fitting-radio">
                                    <span class="fitting-card__radio-visual"></span>
                                    <span class="fitting-card__radio-text">Выбрать</span>
                                </label>
                                <button class="fitting-card__trash" type="button" aria-label="Удалить">
                                    <svg viewBox="0 0 30 30" fill="currentColor"><path d="M9 25a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9H9v16zM22 4h-4l-1-1h-4l-1 1H8v3h14V4z"/></svg>
                                </button>
                                <img src="${resolveAsset(item.image)}" alt="${item.name}">
                            `;

                            clothesGrid.appendChild(card);
                        });

                        section.appendChild(clothesGrid);
                        grid.appendChild(section);
                    }
                }
            }

            // =========================================
            // 3. ОБРАБОТКА КЛИКОВ
            // =========================================
            grid.addEventListener('click', async (e) => {
                const photoCard = e.target.closest('.fitting-photo-card');
                if (photoCard) {
                    document.querySelectorAll('.fitting-photo-card').forEach(c => c.classList.remove('is-selected'));
                    photoCard.classList.add('is-selected');
                    return;
                }

                const clothesCard = e.target.closest('.fitting-card');
                if (clothesCard && !e.target.closest('.fitting-card__trash')) {
                    const radio = clothesCard.querySelector('.fitting-radio');
                    if (radio) {
                        const groupName = radio.name;
                        document.querySelectorAll(`input[name="${groupName}"]`).forEach(r => {
                            const c = r.closest('.fitting-card');
                            if (c) c.classList.remove('is-selected');
                            r.checked = false;
                        });
                        radio.checked = true;
                        clothesCard.classList.add('is-selected');
                    }
                    return;
                }

                const trashBtn = e.target.closest('.fitting-card__trash');
                if (trashBtn) {
                    const card = trashBtn.closest('.fitting-card');
                    const productId = card.dataset.id;

                    try {
                        const res = await fetch(`${API_BASE}/api/wishlist/toggle`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: userId, product_id: productId })
                        });

                        if (res.ok) {
                            card.style.opacity = '0';
                            card.style.transform = 'scale(0.8)';
                            card.style.transition = 'all 0.3s ease';
                            setTimeout(() => {
                                wishlistItems = wishlistItems.filter(i => String(i.id) !== productId);
                                renderGrid();
                            }, 300);
                        }
                    } catch (err) {
                        console.error('Ошибка удаления:', err);
                    }
                }
            });

            // =========================================
            // 4. КНОПКА "ПРИМЕРИТЬ" — РЕАЛЬНЫЙ ЗАПРОС
            // =========================================
            btn.addEventListener('click', async () => {
                // Кнопка "Сбросить" — очищаем результат
                if (state === 'done') {
                    state = 'idle';
                    btn.textContent = 'Примерить';
                    placeholder.style.display = 'block';
                    placeholder.innerHTML = 'Выберите фото и одежду,<br>затем нажмите «Примерить»';
                    const oldImg = previewContainer.querySelector('.fitting-preview__result');
                    if (oldImg) oldImg.remove();
                    return;
                }

                if (state === 'loading') return;

                // --- Проверяем выбор ---
                const selectedPhotoCard = document.querySelector('.fitting-photo-card.is-selected');
                if (!selectedPhotoCard) {
                    alert('Выберите одно фото (кликните по карточке)');
                    return;
                }

                const selectedCards = document.querySelectorAll('.fitting-card.is-selected');
                if (selectedCards.length === 0) {
                    alert('Выберите хотя бы один предмет одежды');
                    return;
                }

                // --- Собираем данные ---
                const sourcePhoto = selectedPhotoCard.dataset.photo;
                const productIds = Array.from(selectedCards).map(c => parseInt(c.dataset.id));

                console.log('📦 Отправка:', { user_id: userId, source_photo: sourcePhoto, product_ids: productIds });

                // --- UI: загрузка ---
                state = 'loading';
                btn.disabled = true;
                btn.textContent = 'Генерация...';
                status.classList.add('is-visible');
                statusText.textContent = 'Идёт генерация...';

                // Вещей несколько — каждая надевается отдельной генерацией,
                // поэтому честно предупреждаем про время.
                const perItem = 'Вещи надеваются по очереди — примерно по 1–5 минут на каждую.';
                statusSub.textContent = productIds.length > 1
                    ? `Выбрано вещей: ${productIds.length}. ${perItem} Не закрывайте страницу.`
                    : 'Первая генерация может занять до 5 минут. Не закрывайте страницу.';

                // --- Опрос прогресса: показываем, какая вещь сейчас надевается ---
                const backendNames = {
                    idm_vton: 'IDM-VTON',
                    qwen_edit: 'Qwen-Image-Edit',
                    kolors: 'Kolors'
                };
                let progressTimer = setInterval(async () => {
                    try {
                        const pr = await fetch(`${API_BASE}/api/generate/progress?user_id=${userId}`);
                        if (!pr.ok) return;
                        const p = await pr.json();
                        if (!p || !p.active) return;

                        if (p.total > 1 && p.step > 0) {
                            statusText.textContent = `Шаг ${p.step} из ${p.total}: ${p.garment || ''}`;
                            statusSub.textContent =
                                `${perItem} Движок: ${backendNames[p.backend] || p.backend || '—'}.` +
                                ' Не закрывайте страницу.';
                        } else if (p.message) {
                            statusText.textContent = p.message;
                        }
                    } catch (err) {
                        /* опрос прогресса не критичен — молча пропускаем */
                    }
                }, 2500);

                // Убираем старое изображение
                const oldImg = previewContainer.querySelector('.fitting-preview__result');
                if (oldImg) oldImg.remove();

                try {
                    const res = await fetch(`${API_BASE}/api/generate/tryon`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            source_photo: sourcePhoto,
                            product_ids: productIds
                        })
                    });

                    const data = await res.json();

                    if (data.status === 'ok') {
                        clearInterval(progressTimer);
                        const resultUrl = `${API_BASE}/${data.result}?t=${Date.now()}`;

                        const img = document.createElement('img');
                        img.className = 'fitting-preview__result';
                        img.src = resultUrl;
                        img.alt = 'Результат примерки';
                        previewContainer.appendChild(img);
                        placeholder.style.display = 'none';

                        // Показываем, какой движок сработал и сколько вещей надето
                        const engineNames = {
                            idm_vton: 'IDM-VTON (примерка по фото вещи)',
                            qwen_edit: 'Qwen-Image-Edit (по описанию)',
                            kolors: 'Kolors'
                        };
                        const engine = engineNames[data.backend] || data.backend || '—';
                        const engineNote = document.getElementById('fitting-engine');
                        if (engineNote) engineNote.remove();
                        const note = document.createElement('div');
                        note.id = 'fitting-engine';
                        note.style.cssText = 'margin-top:10px;font-size:13px;opacity:.75;text-align:center;';
                        note.textContent = `Движок: ${engine}. Надето вещей: ${data.garments_applied || 1}.`;
                        previewContainer.appendChild(note);

                        state = 'done';
                        btn.textContent = 'Сбросить';
                        status.classList.remove('is-visible');
                        btn.disabled = false;

                        console.log('✅ Готово! generation_id =', data.generation_id,
                                    'движок =', data.backend,
                                    'вещей =', data.garments_applied);
                    } else {
                        clearInterval(progressTimer);
                        alert('Не удалось сгенерировать: ' + (data.message || 'Неизвестная ошибка') +
                              (data.details ? '\n\nДетали: ' + data.details : ''));
                        state = 'idle';
                        btn.textContent = 'Примерить';
                        status.classList.remove('is-visible');
                        btn.disabled = false;
                    }
                } catch (err) {
                    clearInterval(progressTimer);
                    console.error('Ошибка сети:', err);
                    alert('Не удалось соединиться с сервером. Проверьте, запущен ли он.');
                    state = 'idle';
                    btn.textContent = 'Примерить';
                    status.classList.remove('is-visible');
                    btn.disabled = false;
                }
            });

            // === СТАРТ ===
            loadData();
        });
    </script>
</body>
</html>
