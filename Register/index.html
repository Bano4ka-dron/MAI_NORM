<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>MAI — Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <svg class="page__texture" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="852" viewBox="0 0 1280 852" preserveAspectRatio="xMidYMid meet">
            <defs>
                <filter id="water-ripple" x="-10%" y="-10%" width="120%" height="120%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise">
                        <animate attributeName="baseFrequency" dur="12s" values="0.012 0.018; 0.018 0.012; 0.012 0.018" repeatCount="indefinite"/>
                    </feTurbulence>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
                </filter>
            </defs>
            <image xlink:href="../images/фон.png" x="0" y="0" width="1280" height="852" filter="url(#water-ripple)"/>
        </svg>

        <main class="main">
            <section class="auth-block">
                <h1 class="auth-logo">MirrAI</h1>

                <div class="auth-field-wrap auth-field-wrap--1">
                    <input class="auth-field" type="text" id="reg-login" placeholder="Логин:" maxlength="32" autocomplete="username">
                    <span class="auth-error" id="err-login"></span>
                </div>

                <div class="auth-field-wrap auth-field-wrap--2">
                    <input class="auth-field" type="email" id="reg-email" placeholder="Почта:" maxlength="64" autocomplete="email">
                    <span class="auth-error" id="err-email"></span>
                </div>

                <div class="auth-field-wrap auth-field-wrap--3">
                    <input class="auth-field auth-field--password is-masked" type="text" id="reg-password" placeholder="Пароль:" maxlength="64" autocomplete="new-password" spellcheck="false">
                    <button class="auth-eye-btn" type="button" id="reg-password-eye" aria-label="Показать пароль">
                        <svg class="auth-eye-btn__closed" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="#0B091A" stroke-width="2" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="#0B091A" stroke-width="2"/>
                        </svg>
                        <svg class="auth-eye-btn__open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="#0B091A" stroke-width="2" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="#0B091A" stroke-width="2"/>
                            <path d="M4 4L20 20" stroke="#0B091A" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="auth-error" id="err-password"></span>
                </div>

                <div class="auth-field-wrap auth-field-wrap--4">
                    <select class="auth-field auth-field--select" id="reg-gender">
                        <option value="" selected disabled>Пол:</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                    <span class="auth-error" id="err-gender"></span>
                </div>

                <div class="auth-field-wrap auth-field-wrap--5">
                    <input class="auth-field auth-field--date" type="text" id="reg-birth" placeholder="Дата рождения:" maxlength="10" inputmode="numeric" autocomplete="bday">
                    <button class="auth-calendar-btn" type="button" id="reg-birth-picker" aria-label="Открыть календарь">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="5" width="18" height="16" rx="3" stroke="#0B091A" stroke-width="2"/>
                            <path d="M3 9H21" stroke="#0B091A" stroke-width="2"/>
                            <path d="M8 3V7" stroke="#0B091A" stroke-width="2" stroke-linecap="round"/>
                            <path d="M16 3V7" stroke="#0B091A" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="8" cy="13" r="1.3" fill="#0B091A"/>
                            <circle cx="12" cy="13" r="1.3" fill="#0B091A"/>
                            <circle cx="16" cy="13" r="1.3" fill="#0B091A"/>
                            <circle cx="8" cy="17" r="1.3" fill="#0B091A"/>
                            <circle cx="12" cy="17" r="1.3" fill="#0B091A"/>
                        </svg>
                    </button>
                    <input class="auth-date-native" type="date" id="reg-birth-native" tabindex="-1" aria-hidden="true">
                    <span class="auth-error" id="err-birth"></span>
                </div>

                <button class="auth-btn auth-btn--primary" type="button" id="reg-btn">Зарегистрироваться</button>
                <a href="../Login/index.html" class="auth-btn auth-btn--secondary">Назад</a>
            </section>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="script.js"></script>
</body>
</html>
